server {
    listen 80;
    server_name localhost;

    # Compress text responses. The app bundle is ~650 KB uncompressed and roughly
    # a quarter of that over the wire once gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Vite writes a content hash into every asset filename, so these can be cached
    # forever. Repeat visits then download nothing but the HTML.
    # "^~" so these win over the image/font regex below: everything under /assets/
    # is content-hashed and can be cached immutably, images included.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise a deploy keeps serving the old
    # asset filenames to returning visitors.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket Proxy for Coolify / Production
    location /ws {
        proxy_pass http://localhost:4003/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
